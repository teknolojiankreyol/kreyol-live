<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kreyòl Captions</title>
<!--
  Big-screen caption page. Options (add to the URL):
    ?transparent=1   transparent background for OBS / vMix browser source
    ?lines=2         how many lines to keep on screen (default 2)
    ?size=56         font size in px (default 56)
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  body.transparent { background: transparent; }
  #box { position: absolute; left: 4vw; right: 4vw; bottom: 5vh; text-align: center; }
  .line { margin: 0.25em 0; line-height: 1.25; opacity: 0.6; transition: opacity 0.3s; }
  .line:last-child { opacity: 1; }
  body.transparent .line { text-shadow: 0 2px 6px #000, 0 0 2px #000; }
  body.transparent #box { background: rgba(0,0,0,0.55); padding: 0.4em 0.8em; border-radius: 12px; }
</style>
</head>
<body>
<div id="box"></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("transparent")) document.body.classList.add("transparent");
  const maxLines = Number(q.get("lines")) || 2;
  const box = document.getElementById("box");
  box.style.fontSize = (Number(q.get("size")) || 56) + "px";

  function add(c) {
    const p = document.createElement("p");
    p.className = "line";
    p.textContent = c.ht;
    box.appendChild(p);
    while (box.children.length > maxLines) box.firstChild.remove();
  }
  const es = new EventSource("/events");
  es.addEventListener("history", (e) => { box.innerHTML = ""; JSON.parse(e.data).slice(-maxLines).forEach(add); });
  es.addEventListener("caption", (e) => add(JSON.parse(e.data)));
  es.addEventListener("clear", () => (box.innerHTML = ""));
</script>
</body>
</html>
